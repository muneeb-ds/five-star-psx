name: Ingest PSX notice
on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: URL of the PSX notice PDF (Recomposition of PSX-KMI All Share Islamic Index)
        required: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: curl -fsSL -o notice.pdf "${{ inputs.pdf_url }}"
      - run: python jobs/ingest.py notice.pdf --url "${{ inputs.pdf_url }}"
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
