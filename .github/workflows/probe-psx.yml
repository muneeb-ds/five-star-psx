name: Probe PSX portal
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          mkdir pages
          curl -sS -m 30 -A "$UA" -o pages/screener.html https://dps.psx.com.pk/screener
          curl -sS -m 30 -A "$UA" -o pages/SWL.html https://dps.psx.com.pk/company/SWL
          curl -sS -m 30 -A "$UA" -o pages/DCR.html https://dps.psx.com.pk/company/DCR
      - uses: actions/upload-artifact@v4
        with: { name: psx-pages, path: pages }
