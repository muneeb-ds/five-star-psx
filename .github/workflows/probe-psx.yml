name: Probe PSX portal
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"
          curl -sS -m 30 -A "$UA" -o swl.html https://dps.psx.com.pk/company/SWL
          python3 - <<'PY'
          import re
          c=open('swl.html').read()
          print("=== IDS", sorted(set(re.findall(r'id="([^"]+)"',c)))[:80])
          b=re.sub(r'<script.*?</script>|<style.*?</style>|<svg.*?</svg>','',c,flags=re.S)
          b=re.sub(r'<(img|link|meta)[^>]*>','',b)
          b=re.sub(r' (style|href|onclick|target|src|data-order|data-filter)="[^"]*"','',b)
          b=re.sub(r'\s+',' ',b)
          for kw in ['quote__','Market Cap','52-WEEK','Financials','Announcements','Payouts','Ratios','Annual','EPS']:
              for m in list(re.finditer(kw,b))[:1]:
                  print('\n=== KW',kw, m.start()); print(b[max(0,m.start()-300):m.start()+1800])
          print('\n=== SCRIPT URLS', re.findall(r'(?:fetch|get|post|ajax)\(["\']([^"\']+)',c)[:30], re.findall(r'["\'](/[a-z\-]+/[A-Za-z\-]+[^"\']*)["\']',c)[:40])
          PY
